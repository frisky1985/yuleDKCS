apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dkcs
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # PostgreSQL (对齐 kustomize deploy/k8s/secrets.yaml)
  postgres-password: {{ .Values.secrets.postgres.password | quote }}
  # Hub 连接串 (与 postgres-password 保持一致)
  database-url: "postgres://{{ .Values.postgres.user }}:{{ .Values.secrets.postgres.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
  redis-password: {{ .Values.secrets.redis.password | quote }}
  jwt-secret: {{ .Values.secrets.jwt.secret | quote }}
  # P1-2 管理 API 管理员凭据 (fail-closed: 未配置时 Hub 拒绝启动)
  admin-username: {{ .Values.secrets.admin.username | quote }}
  admin-password: {{ .Values.secrets.admin.password | quote }}
