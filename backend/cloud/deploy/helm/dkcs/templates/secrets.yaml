apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dkcs
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  mysql-root-password: {{ .Values.secrets.mysql.rootPassword | quote }}
  mysql-password: {{ .Values.secrets.mysql.dkPassword | quote }}
  redis-password: {{ .Values.secrets.redis.password | quote }}
  jwt-secret: {{ .Values.secrets.jwt.secret | quote }}
