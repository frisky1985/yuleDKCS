apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hub-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: hub
    app.kubernetes.io/name: hub
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Hub 使用 DATABASE_URL (Secret: database-url), 见 hub-deployment.yaml
  REDIS_ADDR: {{ .Values.hub.redis.addr | quote }}
  KAFKA_BROKERS: {{ .Values.hub.kafka.brokers | quote }}
  LOG_LEVEL: {{ .Values.hub.logLevel | quote }}
  LOG_FORMAT: {{ .Values.hub.logFormat | quote }}
  METRICS_ENABLED: {{ .Values.hub.metricsEnabled | quote }}
  METRICS_PORT: {{ .Values.hub.metricsPort | quote }}
  METRICS_PATH: "/metrics"
  REST_PORT: "8080"
  GRPC_PORT: "9090"
