version: '3.8'

services:
  # ── PostgreSQL 16 (Hub + DKCS 共享) ──
  postgres:
    image: postgres:16-alpine
    container_name: dk-postgres
    environment:
      POSTGRES_USER: yuledkcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuledkcs}
      POSTGRES_DB: yuledkcs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuledkcs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dk-net

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: dk-redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dk-net

  # ── Kafka ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dk-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    networks:
      - dk-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dk-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - dk-net

  # ── Digital Key HUB ──
  hub:
    build:
      context: ./hub
      dockerfile: Dockerfile
    container_name: dk-hub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"   # REST API
      - "9090:9090"   # gRPC
    environment:
      # Hub 必需: 持久化连接串 (未设置拒绝启动; 表结构由内置迁移自动创建)
      - DATABASE_URL=postgres://yuledkcs:${POSTGRES_PASSWORD:-yuledkcs}@postgres:5432/yuledkcs?sslmode=disable
      # Hub 必需: 管理端 HS256 令牌签名密钥 (弱/空值拒绝启动)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # Hub 必需: 至少配置一种认证源 — 管理端凭据 或 OEM JWKS (均未配置拒绝启动)
      # - ADMIN_USERNAME=change-me
      # - ADMIN_PASSWORD=change-me-strong-password
      # - OEM_JWKS_URLS=oemA=https://a.example.com/jwks,oemB=https://b.example.com/jwks
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - METRICS_ENABLED=true
      - METRICS_PORT=9093
      - METRICS_PATH=/metrics
      # P1-2 管理 API 鉴权（fail-closed：至少配置一个来源，否则 Hub 拒绝启动）：
      # - OEM_JWKS_URLS: 逗号分隔 oemId=url 对，如 oemA=https://a.example.com/jwks（为空则仅管理员令牌可用）
      # - ADMIN_USERNAME/ADMIN_PASSWORD: 管理员登录凭据（生产用强随机值）
      # - OEM_JWKS_URLS=${OEM_JWKS_URLS:-}
      # - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      # - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    networks:
      - dk-net

  # ── Digital Key Cloud Service ──
  dkcs:
    build:
      context: ./dkcs
      dockerfile: Dockerfile
    container_name: dk-dkcs
    depends_on:
      - hub
      - postgres
    ports:
      - "9091:9091"   # gRPC (车厂内网)
    environment:
      - HUB_ADDR=hub:9090
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=yuledkcs
      - DB_PASSWORD=${POSTGRES_PASSWORD:-yuledkcs}
      - DB_NAME=yuledkcs
      - DB_SSL_MODE=disable
      - MQTT_BROKER=tcp://emqx:1883
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - METRICS_ENABLED=true
      - METRICS_PORT=9091
      - METRICS_PATH=/metrics
    restart: unless-stopped
    networks:
      - dk-net

  # ── EMQX MQTT Broker (TCU连接) ──
  emqx:
    image: emqx/emqx:5.5
    container_name: dk-emqx
    ports:
      - "1883:1883"   # MQTT TCP
      - "8083:8083"   # MQTT WebSocket
      - "18083:18083" # Dashboard
    environment:
      - EMQX_NAME=dk_emqx
      - EMQX_LOADED_MODULES=emqx_mod_acl_internal
    volumes:
      - emqx_data:/opt/emqx/data
    networks:
      - dk-net

volumes:
  pgdata:
  redis_data:
  zk_data:
  kafka_data:
  emqx_data:

networks:
  dk-net:
    driver: bridge
