---
# ── postgres-exporter 独立 Deployment + Service ──
# 用途: 采集 PostgreSQL 指标, 供 Prometheus 抓取。
#       Prometheus 静态抓取目标已在 monitoring/prometheus-config.yaml 中声明:
#         job_name: postgres-exporter → targets: ['postgres-exporter:9187']
# 对齐对象: postgres/statefulset.yaml (Service 名 postgres:5432, 用户/库 yuledkcs)。
# 凭据: 密码直接引用 Secret dkcs-secrets key postgres-password,
#       $(POSTGRES_PASSWORD) 由 Kubernetes 在同一容器内展开, 不落盘明文。
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: dkcs-prod
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: dkcs-prod
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9187
              name: metrics
          env:
            # 连接串: 主机名 postgres 对应 postgres/statefulset.yaml 中 headless Service;
            # 用户/库与 POSTGRES_USER / POSTGRES_DB (yuledkcs) 保持一致。
            - name: DATA_SOURCE_NAME
              value: "postgresql://yuledkcs:$(POSTGRES_PASSWORD)@postgres:5432/yuledkcs?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dkcs-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
