---
# ── Staging Secrets (for development / non-prod environments)
# Production secrets should be managed via external-secrets, SealedSecrets, or Vault.
# This is a template; do NOT commit real secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: dkcs-secrets
  namespace: dkcs-staging
  labels:
    app.kubernetes.io/name: dkcs-secrets
    app.kubernetes.io/part-of: digital-key
type: Opaque
stringData:
  postgres-password: "change-me-pg-password"
  # Hub 连接串（与 postgres-password 保持一致；生产用托管 PG 时替换为真实 DSN）
  database-url: "postgres://yuledkcs:change-me-pg-password@postgres:5432/yuledkcs?sslmode=disable"
  redis-password: "change-me-redis-password"
  jwt-secret: "change-me-jwt-secret-at-least-32-chars-long"
  # P1-2 管理 API 管理员凭据（生产必须替换为强随机值；未配置时 Hub 拒绝启动 fail-closed）
  admin-username: "change-me-admin-username"
  admin-password: "change-me-admin-password-at-least-16-chars"
  # TLS 证书（生产用 cert-manager 或托管证书）
  # tls.crt: "-----BEGIN CERTIFICATE-----..."
  # tls.key: "-----BEGIN PRIVATE KEY-----..."
