---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dkcs-ingress
  namespace: dkcs-prod
  labels:
    app.kubernetes.io/name: dkcs-ingress
    app.kubernetes.io/part-of: digital-key
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.digitalkey.example.com
      secretName: dkcs-tls-prod
    - hosts:
        - api-staging.digitalkey.example.com
      secretName: dkcs-tls-staging
  rules:
    - host: api.digitalkey.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  number: 8080
          - path: /grpc
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  number: 9090
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  number: 8080
    - host: api-staging.digitalkey.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  number: 8080
