---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Target namespace (prod) ──
namespace: dkcs-prod

# ── Common labels ──
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: digital-key

# ── Name prefix for all resources ──
namePrefix: ""

# ── Resources ──
resources:
  - namespace.yaml
  - secrets.yaml
  - pdb.yaml
  - ingress.yaml

  # Hub service
  - hub/configmap.yaml
  - hub/service.yaml
  - hub/deployment.yaml
  - hub/hpa.yaml

  # DKCS service
  - dkcs/configmap.yaml
  - dkcs/service.yaml
  - dkcs/deployment.yaml
  - dkcs/hpa.yaml

  # Infrastructure
  - postgres/statefulset.yaml
  - redis/statefulset.yaml
  - kafka/kafka.yaml
  - emqx.yaml

  # Monitoring
  - monitoring/prometheus-config.yaml

# ── ConfigMap generator ──
configMapGenerator:
  - name: grafana-dashboards
    namespace: dkcs-prod
    files:
      - monitoring/grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

# ── Images ──
images:
  - name: hub
    newName: docker.io/yuledkcs/hub
    newTag: latest
  - name: dkcs
    newName: docker.io/yuledkcs/dkcs
    newTag: latest
