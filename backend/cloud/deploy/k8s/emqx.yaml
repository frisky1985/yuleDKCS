---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: dkcs-prod
  labels:
    app: emqx
spec:
  selector:
    app: emqx
  ports:
    - name: mqtt-tcp
      port: 1883
      targetPort: 1883
      protocol: TCP
    - name: mqtt-ws
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: dashboard
      port: 18083
      targetPort: 18083
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: dkcs-prod
  labels:
    app: emqx
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: mqtt
    app.kubernetes.io/part-of: digital-key
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      containers:
        - name: emqx
          image: "emqx/emqx:5.5"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1883
              name: mqtt-tcp
            - containerPort: 8083
              name: mqtt-ws
            - containerPort: 18083
              name: dashboard
          env:
            - name: EMQX_NAME
              value: "dk_emqx"
            - name: EMQX_LOADED_MODULES
              value: "emqx_mod_acl_internal"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: emqx-data
              mountPath: /opt/emqx/data
      volumes:
        - name: emqx-data
          emptyDir: {}
