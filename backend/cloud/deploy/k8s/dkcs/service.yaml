---
apiVersion: v1
kind: Service
metadata:
  name: dkcs
  namespace: dkcs-prod
  labels:
    app: dkcs
    app.kubernetes.io/name: dkcs
    app.kubernetes.io/component: control-plane
spec:
  selector:
    app: dkcs
  ports:
    - name: grpc
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
  type: ClusterIP
