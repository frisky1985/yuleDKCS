---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dkcs-config
  namespace: dkcs-prod
  labels:
    app: dkcs
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "yuledkcs"
  DB_NAME: "yuledkcs"
  DB_SSL_MODE: "disable"
  DB_MAX_OPEN_CONNS: "100"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME_MIN: "30"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC_KEY_EVENTS: "dkcs.key.events"
  KAFKA_TOPIC_COMMANDS: "dkcs.commands"
  KAFKA_TOPIC_EVENTS: "dkcs.events"
  KAFKA_TOPIC_DLQ: "dkcs.dlq"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "stdout"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9091"
  METRICS_PATH: "/metrics"
  GRPC_PORT: "9091"
  HUB_ADDR: "hub:9090"
  MQTT_BROKER: "tcp://emqx:1883"
  JWT_ISSUER: "dkcs"
  JWT_EXPIRE_HOURS: "24"
