---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dkcs
  namespace: dkcs-prod
  labels:
    app: dkcs
    app.kubernetes.io/name: dkcs
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: digital-key
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dkcs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dkcs
        app.kubernetes.io/name: dkcs
        app.kubernetes.io/component: control-plane
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: dkcs
          image: "${IMAGE_REGISTRY:-docker.io}/yuledkcs/dkcs:${IMAGE_TAG:-latest}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: grpc
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dkcs-secrets
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dkcs-secrets
                  key: redis-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dkcs-secrets
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: dkcs-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            grpc:
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 30
