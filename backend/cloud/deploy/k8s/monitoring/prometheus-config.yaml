---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dkcs-prod
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      scrape_timeout:      10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # ── Hub Service ──
      - job_name: 'hub'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - dkcs-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: hub
            action: keep
          - source_labels: [__address__]
            regex: (.*):9093
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'go_(.*)'
            action: keep
          - source_labels: [__name__]
            regex: 'grpc_(.*)'
            action: keep
          - source_labels: [__name__]
            regex: 'http_(.*)'
            action: keep
          - source_labels: [__name__]
            regex: 'process_(.*)'
            action: keep

      # ── DKCS Service ──
      - job_name: 'dkcs'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - dkcs-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: dkcs
            action: keep
          - source_labels: [__address__]
            regex: (.*):9091
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # ── Kafka Exporter ──
      - job_name: 'kafka-exporter'
        static_configs:
          - targets:
              - 'kafka-exporter:9308'

      # ── Postgres Exporter ──
      - job_name: 'postgres-exporter'
        static_configs:
          - targets:
              - 'postgres-exporter:9187'

      # ── Redis Exporter ──
      - job_name: 'redis-exporter'
        static_configs:
          - targets:
              - 'redis-exporter:9121'

      # ── Kubernetes API Server ──
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # ── Kubernetes Nodes ──
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: dkcs-prod
  labels:
    app: prometheus
data:
  dkcs-alerts.yml: |
    groups:
      - name: dkcs-service-alerts
        interval: 30s
        rules:
          - alert: HubHighErrorRate
            expr: rate(grpc_server_handled_total{grpc_code=~"Internal|Unavailable|Unknown"}[5m]) / rate(grpc_server_handled_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Hub service high error rate ({{ $value | humanizePercentage }})"
              description: "Error rate for Hub gRPC requests exceeds 5% over the last 5 minutes."

          - alert: DKCSHighErrorRate
            expr: rate(grpc_server_handled_total{grpc_code=~"Internal|Unavailable|Unknown"}[5m]) / rate(grpc_server_handled_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "DKCS service high error rate ({{ $value | humanizePercentage }})"
              description: "Error rate for DKCS gRPC requests exceeds 5% over the last 5 minutes."

          - alert: HubHighLatency
            expr: histogram_quantile(0.95, rate(grpc_server_handling_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Hub p95 latency > 2s"
              description: "Hub service p95 latency is {{ $value }}s over the last 5 minutes."

          - alert: DKCSHighLatency
            expr: histogram_quantile(0.95, rate(grpc_server_handling_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "DKCS p95 latency > 2s"
              description: "DKCS service p95 latency is {{ $value }}s over the last 5 minutes."

          - alert: HubDown
            expr: up{job="hub"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Hub instance {{ $labels.instance }} is down"

          - alert: DKCSDown
            expr: up{job="dkcs"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "DKCS instance {{ $labels.instance }} is down"

          - alert: HighGoroutineCount
            expr: go_goroutines > 500
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High goroutine count ({{ $value }}) on {{ $labels.instance }}"
