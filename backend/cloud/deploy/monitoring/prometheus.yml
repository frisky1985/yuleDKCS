# yuleDKCS Prometheus Configuration
# Standalone monitoring config for use with docker-compose or independent deployment

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── Hub Service ──
  - job_name: 'hub'
    static_configs:
      - targets:
          - 'hub:9093'
        labels:
          service: hub
          environment: 'development'

  # ── DKCS Service ──
  - job_name: 'dkcs'
    static_configs:
      - targets:
          - 'dkcs:9091'
        labels:
          service: dkcs
          environment: 'development'

  # ── MySQL Exporter ──
  - job_name: 'mysql'
    static_configs:
      - targets:
          - 'mysql-exporter:9104'

  # ── Redis Exporter ──
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  # ── Kafka Exporter ──
  - job_name: 'kafka'
    static_configs:
      - targets:
          - 'kafka-exporter:9308'
