# test-docker-compose.yml — 轻量级集成测试用 Docker Compose
#
# 用法:
#   cd tests
#   docker compose -f test-docker-compose.yml up -d
#   sleep 10  # wait for hub to start
#   curl http://localhost:8080/healthz
#   # 运行集成测试...
#   docker compose -f test-docker-compose.yml down -v
#
# 最小依赖：yuleHUB + PostgreSQL，无 Kafka/ZK/Redis。

version: '3.8'

services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    container_name: yulehub-test-db
    environment:
      POSTGRES_DB: yulehub_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "15432:5432"  # 映射到 15432 避免与本地 PG 冲突
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d yulehub_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # 容器停止后数据自动丢失

  # ── yuleHUB ──
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    image: yulehub:test
    container_name: yulehub-test-server
    ports:
      - "8080:8080"   # REST API
      - "9090:9090"   # gRPC
    environment:
      JWT_SECRET: docker-test-secret-change-me
      GIN_MODE: release
      # 容器内 hub-server 默认使用端口 8080/9090
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || curl -sf http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
