version: '3.8'
services:
  hub:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DB_DSN=postgres://user:pass@db:5432/yuledkcs?sslmode=disable
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yuledkcs
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
