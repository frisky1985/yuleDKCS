# yuleDKCS 本地开发依赖
# 用法: docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: yuledkcs-postgres
    environment:
      POSTGRES_USER: yuledkcs
      POSTGRES_PASSWORD: yuledkcs
      POSTGRES_DB: yuledkcs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuledkcs"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
