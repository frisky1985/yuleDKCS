# yuleDKCS iOS SwiftLint 配置文件
# Phase 3: 统一 iOS 代码质量门禁

disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_name
  - function_body_length
  - file_length
  - cyclomatic_complexity
  - nesting

# ASIL-B(D) 安全关键代码不允许 force_cast / force_try
# 这两个规则已从 disabled_rules 中移除，默认启用

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - colon
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - indentation_width
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - strict_fileprivate
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import
  - unused_declaration

included:
  - ../ios-app
  - ../ios

excluded:
  - Pods
  - Carthage
  - Derived
  - .build

# Rules
force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
    error: 3

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - i
    - j
    - k
    - id
    - x
    - y
    - z

type_name:
  min_length: 3
  max_length: 50
  excluded:
    - DK

# Custom rules
custom_rules:
  print_usage:
    name: "Print Usage"
    regex: "(print|debugPrint|dump)\\("
    match_kinds:
      - identifier
    message: "Prefer os_log over print()"
    severity: warning

  nsobject_prefixed:
    name: "NSObject Prefixed"
    regex: "NSLog\\("
    match_kinds:
      - identifier
    message: "Use os.log instead of NSLog"
    severity: error

reporter: "xcode"
