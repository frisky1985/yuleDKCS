name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs_site/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'DEPLOYMENT_PLAN.md'
      - 'TASK_STATUS.md'
      - '.github/workflows/deploy-docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin mkdocs-awesome-pages-plugin mkdocs-glightbox \
            pymdown-extensions

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: mkdocs build --site-dir site
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
