name: Security Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        cd backend/dkcs && govulncheck ./... || echo "Vulnerabilities found — see report above"
