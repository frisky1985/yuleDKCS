# yuleDKCS 前端 SDK 测试 CI
# 触发: push / PR → main, 以及手动调度
# 环境: ubuntu-latest (Android) + macos-latest (iOS)

name: Frontend SDK Test

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "frontend/ios/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "frontend/ios/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # Android SDK 单元测试
  # ══════════════════════════════════════════════════════════════
  android-sdk-test:
    name: Android SDK Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.gradle/caches
            frontend/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/**/*.gradle.kts', 'frontend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android SDK Unit Tests
        run: ./gradlew :sdk:testDebugUnitTest

      - name: Run Android App Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            frontend/android/build/reports/tests/
            frontend/android-app/build/reports/tests/
          retention-days: 14

      - name: Publish Android Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Android SDK Tests
          path: "frontend/**/build/test-results/**/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

  # ══════════════════════════════════════════════════════════════
  # iOS SDK 单元测试 (Xcode project)
  # ══════════════════════════════════════════════════════════════
  ios-sdk-test:
    name: iOS SDK Test
    runs-on: macos-14
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: frontend/ios/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('frontend/ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Run iOS SDK Tests
        run: |
          cd ios
          xcodebuild test \
            -project project.yml \
            -scheme "DigitalKeySDK" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run iOS App Tests
        run: |
          cd ios-tests
          xcodebuild test \
            -project DigitalKeyApp.xcodeproj \
            -scheme "DigitalKeyApp" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload iOS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            frontend/ios/DerivedData/Logs/Test/
          retention-days: 14

      - name: Publish iOS Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: iOS SDK Tests
          path: "frontend/**/DerivedData/**/*.xml"
          reporter: java-junit
          fail-on-error: false
