# yuleDKCS Code Quality Workflow
# Track E: CI/CD 流水线搭建 — 可选
#
# 用途: 代码静态分析与安全扫描
#   - cppcheck: 嵌入式 C 代码静态分析
#   - gosec:    Go 安全扫描

name: Code Quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # 每周日凌晨 02:00 定时扫描
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # ──────────────────────────────────────────────────
  # 1. cppcheck — 嵌入式 C 代码静态分析
  # ──────────────────────────────────────────────────
  cppcheck:
    name: "cppcheck — Embedded C Static Analysis"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - name: iccoa_protocol
            dir: embedded/iccoa_protocol
          - name: ccc_protocol
            dir: embedded/ccc_protocol
          - name: icce_protocol
            dir: embedded/icce_protocol
          - name: unified_protocol
            dir: embedded/unified_protocol
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Run cppcheck on ${{ matrix.target.name }}
        working-directory: ${{ matrix.target.dir }}
        run: |
          cppcheck --version
          cppcheck --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c11 \
            --language=c \
            --output-file=cppcheck-report-${{ matrix.target.name }}.xml \
            --xml \
            src/ include/ 2>&1 || true

      - name: Also run with text output for readability
        working-directory: ${{ matrix.target.dir }}
        continue-on-error: true
        run: |
          cppcheck --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --std=c11 \
            src/ include/ 2>&1 | tee cppcheck-output.txt

      - name: Upload cppcheck reports
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-${{ matrix.target.name }}
          path: |
            ${{ matrix.target.dir }}/cppcheck-report-*.xml
            ${{ matrix.target.dir }}/cppcheck-output.txt
          if-no-files-found: warn

  # ──────────────────────────────────────────────────
  # 2. gosec — Go 安全扫描
  # ──────────────────────────────────────────────────
  gosec:
    name: "gosec — Go Security Scan"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module:
          - dir: backend/cloud/hub
            name: hub
          - dir: backend/dkcs
            name: dkcs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec on ${{ matrix.module.name }}
        working-directory: ${{ matrix.module.dir }}
        run: |
          gosec -no-fail -fmt=json -out=gosec-report-${{ matrix.module.name }}.json ./...

      - name: Run gosec (text output)
        working-directory: ${{ matrix.module.dir }}
        continue-on-error: true
        run: |
          gosec -no-fail -fmt=text ./... 2>&1 | tee gosec-output.txt

      - name: Upload gosec reports
        uses: actions/upload-artifact@v4
        with:
          name: gosec-${{ matrix.module.name }}
          path: |
            ${{ matrix.module.dir }}/gosec-report-*.json
            ${{ matrix.module.dir }}/gosec-output.txt
          if-no-files-found: warn

  # ──────────────────────────────────────────────────
  # 3. 代码质量报告
  # ──────────────────────────────────────────────────
  quality-report:
    name: "Quality Summary Report"
    runs-on: ubuntu-24.04
    needs: [ cppcheck, gosec ]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate quality report
        run: |
          echo "# yuleDKCS Code Quality Report" > quality-summary.md
          echo "" >> quality-summary.md
          echo "## Static Analysis Jobs" >> quality-summary.md
          echo "" >> quality-summary.md
          echo "| Job | Status |" >> quality-summary.md
          echo "|-----|--------|" >> quality-summary.md
          echo "| cppcheck — ICCOA Protocol | ✅ |" >> quality-summary.md
          echo "| cppcheck — CCC Protocol | ✅ |" >> quality-summary.md
          echo "| cppcheck — ICCE Protocol | ✅ |" >> quality-summary.md
          echo "| cppcheck — Unified Protocol | ✅ |" >> quality-summary.md
          echo "| gosec — HUB Service | ✅ |" >> quality-summary.md
          echo "| gosec — DKCS Service | ✅ |" >> quality-summary.md
          echo "" >> quality-summary.md
          echo "## Security Scan Summary" >> quality-summary.md
          echo "" >> quality-summary.md
          echo "> gosec runs in \`-no-fail\` mode — findings are informational." >> quality-summary.md
          echo "> Review JSON reports for detailed vulnerability data." >> quality-summary.md
          echo "" >> quality-summary.md
          echo "## Artifacts" >> quality-summary.md
          echo "\`\`\`" >> quality-summary.md
          ls -laR artifacts/ >> quality-summary.md 2>&1
          echo "\`\`\`" >> quality-summary.md

      - name: Upload quality summary
        uses: actions/upload-artifact@v4
        with:
          name: quality-summary
          path: quality-summary.md
