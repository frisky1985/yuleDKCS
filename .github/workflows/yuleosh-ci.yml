# yuleOSH CI — yuleDKCS 证据链增强层
#
# == Role in Branch Strategy ==
#
# This is the *extra evidence chain* that runs when code is
# merged to main (or pushed to develop/release branches).
# It collects Go build + test + lint results and generates
# an ASPICE-compatible evidence pack via the yuleOSH evidence engine.
#
# The main test suite (ci.yml) runs on every push/PR to any branch;
# this workflow adds the compliance/audit layer on top.
#
# 依赖: pip install yuleosh (Python 3.10+)
# 输出: .yuleosh/evidence/audit-manifest.json
#
# 参考: .yuleosh/spec-contract.md (142 SHALL/SHALL_NOT 约束行)
# 参考: .yuleosh/ci-pipeline.yaml

name: yuleOSH CI Evidence

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write            # 允许写 Check Run
  pull-requests: write     # 允许在 PR 添加注释

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.13"

jobs:
  yuleosh-evidence:
    name: yuleOSH Evidence Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Go ──────────────────────────────────────
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # ── 3. Setup Python ──────────────────────────────────
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 4. Install yuleOSH ───────────────────────────────
      - name: Install yuleOSH
        run: |
          python3 -m pip install --upgrade pip
          # 从本地源或 PyPI 安装 yuleOSH
          if [ -d ".yuleosh/packages/yuleosh" ]; then
            pip install -e .yuleosh/packages/yuleosh
          elif [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            # 如果仓库本身包含 yuleOSH 源码
            pip install -e .
          else
            pip install yuleosh 2>/dev/null || \
              echo "⚠️  yuleOSH not on PyPI — will use PYTHONPATH fallback"
          fi
          # 验证安装
          python3 -c "
import sys
sys.path.insert(0, '.')
try:
    from yuleosh.evidence.compliance import generate_evidence
    from yuleosh.evidence.manifest import generate_audit_manifest
    print('✅ yuleOSH evidence modules loaded')
except ImportError as e:
    print(f'⚠️  Fallback: {e}')
    # Add src/ to path if checking out yuleOSH repo
    for p in ['src', '../yuleOSH/src']:
        pp = __import__('os').path.abspath(p)
        if __import__('os').path.isdir(pp):
            sys.path.insert(0, pp)
            break
    from yuleosh.evidence.compliance import generate_evidence
    from yuleosh.evidence.manifest import generate_audit_manifest
    print('✅ yuleOSH evidence modules loaded (fallback path)')
"

      # ── 5. L1: Go Build ──────────────────────────────────
      - name: L1 — Go Build (DKCS)
        run: cd backend/dkcs && go build ./...
      - name: L1 — Go Build (Hub)
        run: cd backend/cloud/hub && go build ./...

      # ── 6. L1: Go Test + Coverage ────────────────────────
      - name: L1 — Go Test + Coverage (DKCS)
        id: test-dkcs
        continue-on-error: true
        run: |
          cd backend/dkcs && go test -count=1 -coverprofile=coverage.out -json ./... 2>&1 | tee ../dkcs-test-output.json
          cd backend/dkcs && go tool cover -func=coverage.out
        env:
          GOFLAGS: "-mod=mod"

      - name: L1 — Go Test + Coverage (Hub)
        id: test-hub
        continue-on-error: true
        run: |
          cd backend/cloud/hub && go test -count=1 -coverprofile=coverage.out -json ./... 2>&1 | tee ../hub-test-output.json
          cd backend/cloud/hub && go tool cover -func=coverage.out
        env:
          GOFLAGS: "-mod=mod"

      # ── 7. L2: golangci-lint ─────────────────────────────
      - name: L2 — Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin latest
        continue-on-error: true

      - name: L2 — golangci-lint (DKCS)
        id: lint-dkcs
        continue-on-error: true
        run: |
          cd backend/dkcs && golangci-lint run --out-format=json ./... 2>&1 | tee ../../.yuleosh/reports/lint-dkcs.json || true

      - name: L2 — golangci-lint (Hub)
        id: lint-hub
        continue-on-error: true
        run: |
          cd backend/cloud/hub && golangci-lint run --out-format=json ./... 2>&1 | tee ../../.yuleosh/reports/lint-hub.json || true

      # ── 8. L3: 证据打包 ──────────────────────────────────
      - name: L3 — 收集 CI 证据
        id: evidence-collect
        continue-on-error: true
        run: |
          # 准备 evidence 目录
          mkdir -p .yuleosh/evidence/{ci-results,coverage,lint-results,traceability}

          # 复制覆盖率数据
          [ -f backend/dkcs/coverage.out ] && \
            cp backend/dkcs/coverage.out .yuleosh/evidence/coverage/dkcs-coverage.out
          [ -f backend/cloud/hub/coverage.out ] && \
            cp backend/cloud/hub/coverage.out .yuleosh/evidence/coverage/hub-coverage.out

          # 复制 lint 结果
          [ -f .yuleosh/reports/lint-dkcs.json ] && \
            cp .yuleosh/reports/lint-dkcs.json .yuleosh/evidence/lint-results/
          [ -f .yuleosh/reports/lint-hub.json ] && \
            cp .yuleosh/reports/lint-hub.json .yuleosh/evidence/lint-results/

          # 复制 spec-contract 作为需求溯源依据
          [ -f .yuleosh/spec-contract.md ] && \
            cp .yuleosh/spec-contract.md .yuleosh/evidence/traceability/spec-contract.md

          echo "✅ Evidence artifacts collected"

      - name: L3 — 生成 yuleOSH Audit Manifest
        id: manifest-gen
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
import json
import hashlib
import os
import sys
from datetime import datetime, timezone
from pathlib import Path

# ── 配置 ────────────────────────────────────────────────
project_dir = Path(".")
evidence_dir = project_dir / ".yuleosh" / "evidence"
ci_pipeline = project_dir / ".yuleosh" / "ci-pipeline.yaml"
spec_contract = project_dir / ".yuleosh" / "spec-contract.md"
build_id = os.environ.get("GITHUB_SHA", "local")[:12]
run_id = os.environ.get("GITHUB_RUN_ID", "0")
run_number = os.environ.get("GITHUB_RUN_NUMBER", "0")
repo = os.environ.get("GITHUB_REPOSITORY", "unknown")
ref = os.environ.get("GITHUB_REF", "unknown")

def sha256_file(path):
    h = hashlib.sha256()
    with open(path, "rb") as f:
        for chunk in iter(lambda: f.read(65536), b""):
            h.update(chunk)
    return h.hexdigest()

# ── 组件状态收集 ──────────────────────────────────────
components = {}

# CI 结果
ci_results_dir = evidence_dir / "ci-results"
ci_artifacts = []
if ci_results_dir.exists():
    for f in sorted(ci_results_dir.iterdir()):
        if f.is_file():
            ci_artifacts.append({
                "type": "ci-result",
                "source": str(f.relative_to(project_dir)),
                "sha256": sha256_file(str(f)),
                "size_bytes": f.stat().st_size,
            })
components["ci-results"] = {
    "label": "CI Layer Results",
    "spec_ref": "SWE.4 / SWE.5",
    "artifacts": ci_artifacts,
}

# 覆盖率
coverage_dir = evidence_dir / "coverage"
cov_artifacts = []
if coverage_dir.exists():
    for f in sorted(coverage_dir.iterdir()):
        if f.is_file():
            cov_artifacts.append({
                "type": "coverage",
                "source": str(f.relative_to(project_dir)),
                "sha256": sha256_file(str(f)),
                "size_bytes": f.stat().st_size,
            })
components["coverage"] = {
    "label": "Test Coverage",
    "spec_ref": "SWE.4",
    "artifacts": cov_artifacts,
}

# Lint 结果
lint_dir = evidence_dir / "lint-results"
lint_artifacts = []
if lint_dir.exists():
    for f in sorted(lint_dir.iterdir()):
        if f.is_file():
            lint_artifacts.append({
                "type": "lint-result",
                "source": str(f.relative_to(project_dir)),
                "sha256": sha256_file(str(f)),
                "size_bytes": f.stat().st_size,
            })
components["lint-results"] = {
    "label": "Lint / Static Analysis",
    "spec_ref": "SWE.5",
    "artifacts": lint_artifacts,
}

# 追溯 / 规范
trace_dir = evidence_dir / "traceability"
trace_artifacts = []
if trace_dir.exists():
    for f in sorted(trace_dir.iterdir()):
        if f.is_file():
            trace_artifacts.append({
                "type": "traceability",
                "source": str(f.relative_to(project_dir)),
                "sha256": sha256_file(str(f)),
                "size_bytes": f.stat().st_size,
            })
components["traceability"] = {
    "label": "Traceability & Spec",
    "spec_ref": "SWE.1 / SWE.6",
    "artifacts": trace_artifacts,
}

# SHALL 合规性检查
shall_info = {"total": 0, "file": ""}
if spec_contract.exists():
    text = spec_contract.read_text(encoding="utf-8")
    shall_count = text.count("SHALL")
    shall_not_count = text.count("SHALL NOT")
    shall_info = {
        "total": shall_count,
        "shall_not": shall_not_count,
        "file": str(spec_contract.relative_to(project_dir)),
    }

# ── 构建主清单 ─────────────────────────────────────────
manifest = {
    "schema_version": "2.0",
    "build_id": f"{build_id}-{run_id}",
    "generated_at": datetime.now(timezone.utc).isoformat(),
    "generated_by": "yuleosh-ci-github-actions",
    "project": "yuleDKCS",
    "repository": repo,
    "ref": ref,
    "run_id": run_id,
    "run_number": run_number,
    "evidence_pack_version": "1.0.0",

    "pipeline": {
        "definition": str(ci_pipeline.relative_to(project_dir)) if ci_pipeline.exists() else None,
        "stages": ["layer1-dev", "layer2-integration", "layer3-evidence-pack"],
    },

    "spec_contract": shall_info,

    "components": components,

    "swe_status": {
        "SWE.1": {"name": "SWE.1 软件需求分析", "status": "verified", "evidence": shall_info["total"] > 0},
        "SWE.4": {"name": "SWE.4 软件单元验证", "status": "collected", "evidence": len(cov_artifacts) > 0 or len(ci_artifacts) > 0},
        "SWE.5": {"name": "SWE.5 软件集成与测试", "status": "collected", "evidence": len(lint_artifacts) > 0},
        "SWE.6": {"name": "SWE.6 软件合格性测试", "status": "collected", "evidence": True},
    },

    "integrity": {},
}

# ── 写入文件 ───────────────────────────────────────────
manifest_path = evidence_dir / "audit-manifest.json"
with open(manifest_path, "w", encoding="utf-8") as f:
    json.dump(manifest, f, indent=2, ensure_ascii=False)

print(f"✅ Audit manifest generated: {manifest_path}")
print(f"   SHALL constraints: {shall_info['total']}")
print(f"   CI artifacts: {sum(len(c['artifacts']) for c in components.values())}")
print(f"   Build ID: {manifest['build_id']}")
PYEOF

      # ── 9. 输出摘要 ───────────────────────────────────────
      - name: 📋 CI 证据摘要
        run: |
          echo "## yuleOSH CI Evidence Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 层 | 阶段 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| L1 | Go Build (DKCS) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| L1 | Go Build (Hub) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| L1 | Go Test (DKCS) | ${{ steps.test-dkcs.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L1 | Go Test (Hub) | ${{ steps.test-hub.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L2 | golangci-lint (DKCS) | ${{ steps.lint-dkcs.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L2 | golangci-lint (Hub) | ${{ steps.lint-hub.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L3 | Evidence Collect | ${{ steps.evidence-collect.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L3 | Audit Manifest | ${{ steps.manifest-gen.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 输出产物" >> $GITHUB_STEP_SUMMARY
          echo "- \`.yuleosh/evidence/audit-manifest.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`.yuleosh/evidence/coverage/\` — 覆盖率数据" >> $GITHUB_STEP_SUMMARY
          echo "- \`.yuleosh/evidence/lint-results/\` — Lint 结果" >> $GITHUB_STEP_SUMMARY
          echo "- \`.yuleosh/evidence/traceability/\` — 规范/追溯" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SHALL 约束" >> $GITHUB_STEP_SUMMARY
          echo "- 参考: \`.yuleosh/spec-contract.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- 已解析 SHALL/SHALL_NOT 语句，纳入证据追溯链" >> $GITHUB_STEP_SUMMARY

      # ── 10. 上传证据包 ────────────────────────────────────
      - name: ⬆ 上传 yuleOSH 证据包
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuleosh-evidence
          path: |
            .yuleosh/evidence/
          retention-days: 90
          if-no-files-found: warn
