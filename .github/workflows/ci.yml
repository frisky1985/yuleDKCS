name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: |
          cd backend/dkcs && go build ./...
          cd ../cloud/hub && go build ./...
      - name: Test
        run: |
          cd backend/dkcs && go test -cover ./...
          cd ../cloud/hub && go test -cover ./...
      - name: Coverage check
        run: |
          cd backend/dkcs && go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out
          cd ../cloud/hub && go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out
