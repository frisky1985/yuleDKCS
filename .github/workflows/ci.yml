name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================
  # Backend — Go build + test
  # ============================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test (core packages)
        run: |
          go test ./internal/iccoa/cert/... -count=1 -v
          go test ./internal/service/... -count=1 -v

  # ============================================================
  # Frontend — Node build + lint
  # ============================================================
  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint 2>/dev/null || echo "lint config optional"

      - name: Type check
        run: npx tsc --noEmit 2>/dev/null || echo "tsc optional"

      - name: Build
        run: npm run build

  # ============================================================
  # Embedded — Static analysis
  # ============================================================
  embedded:
    name: Embedded (C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Static analysis
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            embedded/src/ 2>&1 || echo "cppcheck found issues (non-blocking for now)"
