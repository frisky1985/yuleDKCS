version: "3.8"

# ─────────────────────────────────────────────────────────
# yuleDKCS Production Deployment
# 生产环境多服务编排 — Hub gRPC + REST + 基础设施
# ─────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Hub Service ─────────────────────────────────────
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      # ⚠️ 注意: 当前 Dockerfile 没有 named target stage
      #   target: builder 在多阶段构建中暂不可用。
      #   如需仅构建 hub，可改为单独 Dockerfile.hub 或调整脚本。
    command: ["/usr/local/bin/hub-server"]
    ports:
      - "8080:8080"   # REST API（通过 Gin/grpc-gateway）
      - "9090:9090"   # gRPC
    environment:
      - HUB_VERSION=0.1.0
      - LOG_LEVEL=info
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:-change-in-production}
      - DB_DSN=${DB_DSN:-postgres://postgres:password@postgres:5432/yuledkcs?sslmode=disable}
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yuledkcs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yuledkcs"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ── Zookeeper (Kafka dependency) ────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    logging: *default-logging

  # ── Kafka ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
