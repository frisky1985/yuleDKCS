// yuleDKCS Mobile SDK 接口定义
//
// 本文件定义 yuleDKCS SDK 对外暴露的全部接口。
// SDK 本身不是 gRPC 服务器，而是以原生库（Swift/Kotlin）形式嵌入车厂 App。
// proto 用于三件事：
//   1. 作为跨平台接口合约（代码生成 Swift/Kotlin stub）
//   2. SDK 内部通过 gRPC 与 yuleDKCS Hub 通信
//   3. 文档化 BLE/UWB 本地协议（不走 gRPC，但 proto 定义接口形状）
//
// 分层:
//   HubService     — 通过 gRPC 与 yuleDKCS Hub 通信（云端操作）
//   BLEService     — BLE/UWB 本地直连车辆 TCU（不经过任何服务器）
//   MailboxClient  — CCC 协议分享时与 Relay Server 通信
//   KeyManager     — 钥匙状态管理（本地缓存 + 云端同步）
//   Callbacks      — SDK → App 的通知回调

syntax = "proto3";

package digitalkey.sdk.v1;

option java_package = "com.yuledkcs.sdk";
option java_multiple_files = true;
option swift_prefix = "YDK";

// ============================================================
// 通用类型
// ============================================================

// 平台枚举 — SDK 内部判断逻辑用
enum Platform {
    PLATFORM_UNSPECIFIED = 0;
    IOS                  = 1;  // Apple iPhone
    ANDROID              = 2;  // 通用 Android
    HUAWEI               = 3;  // 华为 HMS (无 GMS)
}

// 协议类型 — SDK 根据此自动选择通信路径
enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    CCC_DK3             = 1;  // Apple Wallet / Samsung Wallet
    ICCOA_DK40          = 2;  // 小米/OPPO/vivo 钱包
    ICCE                = 3;  // 华为钱包
}

// 连接状态
enum BLEConnectionState {
    DISCONNECTED = 0;
    SCANNING     = 1;
    CONNECTING   = 2;
    CONNECTED    = 3;
}

// ============================================================
// SDK 初始化
// ============================================================

message SDKConfig {
    string hub_endpoint       = 1;  // Hub gRPC 地址 (host:port)
    string relay_endpoint     = 2;  // Relay Server 地址 (可选, CCC 使用)
    Platform platform         = 3;
    int32  ble_scan_timeout_ms = 4;  // BLE 扫描超时 (默认 10000)
    bool   enable_logging     = 5;
}

// ============================================================
// HubService — 云端操作 (gRPC → yuleDKCS Hub)
// 所有接口都需要 App 先调用 setToken() 传入 session token
// ============================================================

service HubService {

    // ─── 钥匙生命周期 ──────────────────────────────────────

    // 绑定钥匙到手机
    // App 应先从车厂 Server 确认用户对车辆有权限，再调用此接口
    rpc BindKey(BindKeyRequest) returns (BindKeyResponse);

    // 解绑钥匙
    rpc UnbindKey(UnbindKeyRequest) returns (UnbindKeyResponse);

    // 查询钥匙列表（所有已绑定的车辆钥匙）
    rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);

    // 查询单把钥匙详情
    rpc GetKey(GetKeyRequest) returns (GetKeyResponse);

    // ─── 钥匙分享 ──────────────────────────────────────────

    // 创建分享（返回 6位分享码，可发给好友）
    rpc CreateShare(CreateShareRequest) returns (CreateShareResponse);

    // 接受分享（输入好友给的分享码）
    rpc AcceptShare(AcceptShareRequest) returns (AcceptShareResponse);

    // 取消分享
    rpc CancelShare(CancelShareRequest) returns (CancelShareResponse);

    // ─── 远程控车 ──────────────────────────────────────────

    // 远程锁车
    rpc RemoteLock(RemoteControlRequest) returns (RemoteControlResponse);

    // 远程解锁
    rpc RemoteUnlock(RemoteControlRequest) returns (RemoteControlResponse);

    // 远程启动/熄火
    rpc RemoteStart(RemoteControlRequest) returns (RemoteControlResponse);
    rpc RemoteStop(RemoteControlRequest) returns (RemoteControlResponse);

    // ─── 通知回调注册 ──────────────────────────────────────

    // App 将 Push 通知的 payload 传给 SDK，SDK 解析后触发回调
    rpc HandlePushNotification(PushPayload) returns (PushAck);
}

// ─── 消息定义 ───────────────────────────────────────────

message BindKeyRequest {
    string session_token  = 1;  // 车厂 Server 签发的 token
    string vehicle_id     = 2;  // VIN
    // 以下字段由 SDK 自动填充，App 无需提供
    // - device_id: SDK 自动生成
    // - device_pubkey: 从手机 SE 读取
    // - protocol: SDK 根据手机型号自动检测
}

message BindKeyResponse {
    string key_id     = 1;
    string vehicle_id = 2;
    string vehicle_name = 3;  // 车辆显示名称（从车厂 Server 获取）
    int64  valid_from = 4;
    int64  valid_until = 5;
    // ⚠️ 绑钥匙成功后，App 需要调用钱包层 API 将钥匙添加到手机钱包
    //   iOS:     PKPassLibrary.addCarKeyPass(...)
    //   Samsung: SamsungWallet.addDigitalKey(...)
    //   小米:     MiWallet.registerKey(...)
    //   华为:     HuaweiWallet.addKey(...)
    // SDK 不负责此步骤，但可提供 `keyData` 给 App 传递给钱包 SDK
    bytes  wallet_key_data = 10;  // 钱包 SDK 所需数据 (协议相关)
}

message UnbindKeyRequest {
    string key_id = 1;
}

message UnbindKeyResponse {
    bool success = 1;
}

message ListKeysRequest {
    // 空请求返回全部钥匙
}

message KeyItem {
    string key_id      = 1;
    string vehicle_id  = 2;
    string vehicle_name = 3;
    Protocol protocol  = 4;
    string status      = 5;  // ACTIVE / SUSPENDED / REVOKED / EXPIRED
    string key_type    = 6;  // OWNER / FRIEND / SERVICE / TEMPORARY
    int64  valid_from  = 7;
    int64  valid_until = 8;
}

message ListKeysResponse {
    repeated KeyItem keys = 1;
}

message GetKeyRequest {
    string key_id = 1;
}

message GetKeyResponse {
    KeyItem key = 1;
}

message CreateShareRequest {
    string key_id      = 1;
    string to_user_id  = 2;  // 指定用户（可选）
    int32  max_uses    = 3;  // 最大使用次数 (0=无限制)
    int64  valid_from  = 4;
    int64  valid_until = 5;
}

message CreateShareResponse {
    string share_id   = 1;
    string share_code = 2;  // 6 位分享码
    string sharing_url = 3;  // CCC Mailbox URL (仅 CCC 协议时返回)
}

message AcceptShareRequest {
    string share_code = 1;  // 6 位分享码
}

message AcceptShareResponse {
    KeyItem key = 1;
}

message CancelShareRequest {
    string share_id = 1;
}

message CancelShareResponse {
    bool success = 1;
}

message RemoteControlRequest {
    string vehicle_id = 1;
    string key_id     = 2;
}

message RemoteControlResponse {
    string cmd_id     = 1;
    int32  result     = 2;  // 0=成功, 非0=错误码
    string error_msg  = 3;
}

// Push 通知 payload — App 收到 Push 后传给 SDK
message PushPayload {
    string type    = 1;  // key_revoked / key_suspended / share_received / vehicle_alert
    string key_id  = 2;
    string message = 3;
    bytes  data    = 4;
}

message PushAck {
    bool handled = 1;
}

// ============================================================
// BLEService — BLE/UWB 本地直连车辆 (不经过任何服务器)
// iOS 上的 BLE 操作受 Core Bluetooth 后台限制
// ============================================================

service BLEService {

    // 扫描周围车辆（返回 BLE 广告包信息）
    rpc ScanVehicles(ScanRequest) returns (stream VehicleAdvertise);

    // 连接到车辆（建立 BLE 安全通道）
    rpc ConnectVehicle(ConnectRequest) returns (ConnectResponse);

    // 解锁（需要先 Connect）
    rpc Unlock(ControlRequest) returns (ControlResponse);

    // 锁车（需要先 Connect）
    rpc Lock(ControlRequest) returns (ControlResponse);

    // 启动引擎（需要先 Connect）
    rpc StartEngine(ControlRequest) returns (ControlResponse);

    // 读取车辆状态
    rpc ReadVehicleStatus(StatusRequest) returns (VehicleStatus);

    // 断开连接
    rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
}

message ScanRequest {
    int32 timeout_ms = 1;  // 扫描超时 (默认 10000ms)
}

message VehicleAdvertise {
    string vehicle_id     = 1;  // 从 BLE 广告包解析
    string vehicle_name   = 2;
    int32  rssi           = 3;  // 信号强度
    int32  protocol       = 4;  // CCC / ICCOA / ICCE (从广告包识别)
    bool   supports_uwb   = 5;  // 是否支持 UWB 精确测距
    bytes  manufacturer_data = 6;  // 厂商自定义数据
}

message ConnectRequest {
    string vehicle_id = 1;
}

message ConnectResponse {
    bool   success       = 1;
    BLEConnectionState state = 2;
    int32  max_payload_size = 3;  // BLE MTU
}

message ControlRequest {
    string vehicle_id = 1;
    // SDK 自动从本地缓存获取当前钥匙
}

message ControlResponse {
    bool   success = 1;
    string error   = 2;
}

message StatusRequest {
    string vehicle_id = 1;
}

message VehicleStatus {
    bool   locked      = 1;
    bool   engine_on   = 2;
    int32  battery_pct = 3;  // 0-100
    int32  range_km    = 4;  // 续航 (纯电/混动)
    string error       = 5;
}

message DisconnectRequest {
    string vehicle_id = 1;
}

message DisconnectResponse {
    bool success = 1;
}

// ============================================================
// MailboxClient — CCC 协议分享专用
// 仅 CCC-DK3 协议使用，ICCOA/ICCE 不走此路径
// Secret 在 URL fragment (#) 中，SDK 负责确保不发送到 Relay Server
// ============================================================

service MailboxClient {
    // 读取分享邮箱中的展示信息（接收方使用）
    rpc ReadDisplayInfo(ReadDisplayInfoRequest) returns (ReadDisplayInfoResponse);

    // 更新邮箱内容（KeySigning / Import / Cancel）
    rpc UpdateMailbox(UpdateMailboxRequest) returns (UpdateMailboxResponse);

    // 删除邮箱（完成分享后）
    rpc DeleteMailbox(DeleteMailboxRequest) returns (DeleteMailboxResponse);
}

message ReadDisplayInfoRequest {
    string mailbox_url = 1;  // 从 shareInfo 获取的完整 URL（含 #secret）
}

message ReadDisplayInfoResponse {
    bytes  display_info = 1;
    int64  version      = 2;
}

message UpdateMailboxRequest {
    string mailbox_id    = 1;
    int32  data_type     = 2;  // 2=KeySigning 3=Import 4=Cancel
    bytes  payload       = 3;  // 端到端加密 (Secret 在 fragment 中)
}

message UpdateMailboxResponse {
    int32  status  = 1;
    int64  version = 2;
}

message DeleteMailboxRequest {
    string mailbox_id = 1;
}

message DeleteMailboxResponse {
    bool success = 1;
}

// ============================================================
// SDK 回调接口 — SDK → App
// App 通过实现此接口接收 SDK 事件
// ============================================================

service SDKCallback {
    // 钥匙状态变更
    rpc OnKeyStatusChanged(KeyStatusChange) returns (CallbackAck);

    // 收到新的钥匙分享
    rpc OnShareReceived(ShareNotification) returns (CallbackAck);

    // 车辆告警
    rpc OnVehicleAlert(VehicleAlert) returns (CallbackAck);

    // BLE 连接状态变化
    rpc OnBLEConnectionStateChanged(BLEConnectionChange) returns (CallbackAck);
}

message KeyStatusChange {
    string key_id  = 1;
    string old_status = 2;
    string new_status = 3;  // REVOKED / SUSPENDED / EXPIRED / ACTIVE
    string reason  = 4;
}

message ShareNotification {
    string share_code    = 1;
    string from_user_id  = 2;
    string vehicle_id    = 3;
    string sharing_url   = 4;  // CCC 协议时可用
}

message VehicleAlert {
    string vehicle_id = 1;
    string alert_type = 2;  // alarm / tow / crash / battery_low
    string message    = 3;
}

message BLEConnectionChange {
    string vehicle_id = 1;
    BLEConnectionState new_state = 2;
}

message CallbackAck {
    bool handled = 1;
}
